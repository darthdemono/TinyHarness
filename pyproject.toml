[project]
name = "tinyharness"
version = "0.1.0"
description = "Zero-dependency starter kit for open-weight AI hack day projects."
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jubair Hasan"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1"]

[project.scripts]
tinyharness = "tinyharness.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinyharness*"]

[tool.setuptools.package-data]
tinyharness = ["skills/*/SKILL.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false

[tool.coverage.run]
branch = true
source = ["tinyharness"]

[tool.coverage.report]
fail_under = 100
show_missing = true
