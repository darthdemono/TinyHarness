name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys. For a security problem use the private reporting form instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show tinyharness` or the commit hash
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `tinyharness doctor`
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: The command you ran and the model or server you used
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
