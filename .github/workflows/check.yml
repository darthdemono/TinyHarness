name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # x64 and arm64 on Linux, macOS and Windows
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      - name: Send coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - run: ruff check .
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      - run: mypy tinyharness
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      - run: python -m build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
  engine:
    # Proves the llama.cpp download picks a real, checksum-valid, runnable build on every target.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - env:
          GITHUB_TOKEN: ${{ github.token }} # the anonymous API limit is shared by runners
        run: python -c "import subprocess, sys; from tinyharness import llamacpp; p = llamacpp.install(); print(p); sys.exit(subprocess.call([p, '--version']))"
  ci-result:
    # The one check the branch ruleset requires; it fails if any job above failed or was cancelled.
    name: CI result
    if: always()
    needs: [test, engine]
    runs-on: ubuntu-latest
    steps:
      - env:
          TEST: ${{ needs.test.result }}
          ENGINE: ${{ needs.engine.result }}
        run: |
          echo "test=$TEST engine=$ENGINE"
          [ "$TEST" = success ] && [ "$ENGINE" = success ]
