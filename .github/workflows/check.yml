name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 and arm64 on Linux, macOS and Windows
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      - run: mypy tinyharness
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      - run: python -m build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
  engine:
    # Proves the llama.cpp download picks a real, checksum-valid, runnable build on every target.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - run: python -c "import subprocess, sys; from tinyharness import llamacpp; p = llamacpp.install(); print(p); sys.exit(subprocess.call([p, '--version']))"
