version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # A release gets a week to be yanked or reported before it is proposed.
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
